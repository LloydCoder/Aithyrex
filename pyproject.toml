[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aithyrex"
version = "0.1.0"
description = "Agentic AI runtime security — inspect AI interactions and emit evidence-bearing threat findings."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Tinlance Limited" }]
requires-python = ">=3.12"
keywords = ["ai-security", "llm-security", "prompt-injection", "runtime-security", "cybersecurity", "mitre-atlas", "openai", "anthropic", "langchain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = ["httpx>=0.27.2"]

[project.optional-dependencies]
server = ["fastapi>=0.143.0", "uvicorn[standard]>=0.30.6", "python-multipart>=0.0.31", "sqlalchemy[asyncio]>=2.0.35", "asyncpg>=0.29.0", "alembic>=1.13.2", "redis>=5.0.8", "anthropic>=1.13.0", "structlog>=24.4.0", "pydantic>=2.9.2", "pydantic-settings>=2.5.2", "stix2>=3.0.1", "PyJWT[crypto]>=2.15.1", "cryptography>=50.0.0"]
openai = ["openai>=1.50.0"]
anthropic = ["anthropic>=1.13.0"]
langchain = ["langchain>=1.4.4", "langchain-anthropic>=1.7.5"]
all = ["aithyrex[server,openai,anthropic,langchain]"]
dev = ["pytest>=9.0.3", "pytest-asyncio>=1.4.0", "pytest-cov>=5.0.0", "ruff>=0.14.0", "bandit>=1.7.10", "pip-audit>=2.7.3"]

[project.urls]
Homepage = "https://github.com/LloydCoder/Aithyrex"
Repository = "https://github.com/LloydCoder/Aithyrex"

[project.scripts]
ai-shield = "ai_shield.cli:main"
aithyrex = "ai_shield.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aithyrex*", "ai_shield*"]
exclude = ["backend*", "frontend*", "tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
addopts = "-v --tb=short --cov=backend --cov-report=term-missing"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
