[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-shield"
version = "0.1.0"
description = "Runtime security for LLM and agentic AI systems — prompt injection, covert channel, and C2 detection."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Tinlance Limited", email = "nwachukwuchinaemerem8@gmail.com" }
]
requires-python = ">=3.10"
keywords = [
    "ai-security", "llm-security", "prompt-injection",
    "runtime-security", "cybersecurity", "mitre-atlas",
    "openai", "anthropic", "langchain",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = ["httpx>=0.27.0"]

[project.optional-dependencies]
server    = ["fastapi>=0.115.0", "uvicorn[standard]>=0.30.0", "sqlalchemy[asyncio]>=2.0.0", "asyncpg>=0.29.0", "alembic>=1.13.0", "redis>=5.0.0", "anthropic>=0.34.0", "structlog>=24.0.0", "pydantic-settings>=2.5.0", "stix2>=3.0.0"]
openai    = ["openai>=1.50.0"]
anthropic = ["anthropic>=0.34.0"]
langchain = ["langchain>=0.2.0"]
all       = ["ai-shield[server,openai,anthropic,langchain]"]
dev       = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0", "pytest-cov>=5.0.0", "ruff>=0.6.0"]

[project.urls]
Homepage   = "https://tinlance.com/ai-shield"
Repository = "https://github.com/Tinlance/ai-shield"

[project.scripts]
ai-shield = "ai_shield.cli:main"

[tool.setuptools.packages.find]
where   = ["."]
include = ["ai_shield*"]
exclude = ["backend*", "frontend*", "tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["backend/tests"]
addopts      = "-v --tb=short --cov=backend --cov-report=term-missing"

[tool.ruff]
target-version = "py312"
line-length    = 100
select         = ["E", "F", "W", "I"]
ignore         = ["E501"]
