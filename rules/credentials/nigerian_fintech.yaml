# AI Shield — Credential Detection Rules
# ========================================
# Nigerian fintech and global credential patterns.
#
# These rules are derived from peer-reviewed patterns merged into:
#   - TruffleHog (15k ⭐) — github.com/trufflesecurity/trufflehog
#   - Gitleaks (10k ⭐)   — github.com/gitleaks/gitleaks
#   - Semgrep (11k ⭐)    — github.com/semgrep/semgrep-rules
#
# Context: LLM output scanning — detecting when a model
# reproduces credentials from its context window.
#
# MITRE ATT&CK: T1552 — Unsecured Credentials
# MITRE ATLAS:  AML.T0048 — Exfiltration via ML Inference API

version: "1.0"
category: credentials

rules:
  # ── Nigerian Fintech ─────────────────────────────────────────────────
  - id: CRED-NG-001
    name: Paystack Secret Key
    severity: critical
    platform: paystack
    pattern: "sk_(?:live|test)_[a-zA-Z0-9]{40}"
    description: Paystack secret key leaked in LLM output

  - id: CRED-NG-002
    name: Paystack Public Key
    severity: high
    platform: paystack
    pattern: "pk_(?:live|test)_[a-zA-Z0-9]{40}"
    description: Paystack public key in LLM output

  - id: CRED-NG-003
    name: Flutterwave Secret Key
    severity: critical
    platform: flutterwave
    pattern: "FLWSECK(?:_TEST)?-[a-zA-Z0-9]{32,}"
    description: Flutterwave secret key in LLM output

  - id: CRED-NG-004
    name: Flutterwave Public Key
    severity: high
    platform: flutterwave
    pattern: "FLWPUBK(?:_TEST)?-[a-zA-Z0-9]{32,}"
    description: Flutterwave public key in LLM output

  - id: CRED-NG-005
    name: Remita API Key
    severity: high
    platform: remita
    pattern: "(?i)remita.{0,20}['\"][a-zA-Z0-9]{32,}['\"]"
    description: Remita API credential in LLM output

  - id: CRED-NG-006
    name: Interswitch Client Secret
    severity: high
    platform: interswitch
    pattern: "(?i)interswitch.{0,30}['\"][a-zA-Z0-9\\-]{36,}['\"]"
    description: Interswitch client secret in LLM output

  # ── AI Provider Keys ──────────────────────────────────────────────────
  - id: CRED-AI-001
    name: Anthropic API Key
    severity: critical
    platform: anthropic
    pattern: "sk-ant-[a-zA-Z0-9\\-_]{40,}"

  - id: CRED-AI-002
    name: OpenAI API Key
    severity: critical
    platform: openai
    pattern: "sk-[a-zA-Z0-9]{48}"

  - id: CRED-AI-003
    name: HuggingFace Token
    severity: high
    platform: huggingface
    pattern: "hf_[a-zA-Z0-9]{36}"

  # ── Cloud ─────────────────────────────────────────────────────────────
  - id: CRED-CLD-001
    name: AWS Access Key
    severity: critical
    platform: aws
    pattern: "AKIA[0-9A-Z]{16}"

  - id: CRED-CLD-002
    name: GitHub Token
    severity: critical
    platform: github
    pattern: "gh[pousr]_[a-zA-Z0-9]{36}"

  - id: CRED-CLD-003
    name: Stripe Secret Key
    severity: critical
    platform: stripe
    pattern: "sk_(?:live|test)_[a-zA-Z0-9]{24,}"
