name: Temporary Frontend Lockfile

on:
  push:
    branches: [godmode/phase-00-04-hardening]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - name: Generate reproducible lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        shell: bash
        run: |
          git diff --check
          if [ -z "$(git status --porcelain -- frontend/package-lock.json)" ]; then
            echo "No lockfile changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "build(frontend): generate npm lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
