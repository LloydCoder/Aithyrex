name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
      - name: Run unit tests
        run: pytest backend/tests/unit/ -v --tb=short
      - name: Run offline red-team evaluation gate
        shell: bash
        run: |
          python -m backend.evaluation.red_team_suite > "$RUNNER_TEMP/aithyrex-red-team-report.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path(os.environ["RUNNER_TEMP"]) / "aithyrex-red-team-report.json"
          report = json.loads(report_path.read_text(encoding="utf-8"))
          summary = {
              "status": report.get("status"),
              "dataset_sha256": report.get("provenance", {}).get("dataset_sha256"),
              "dataset_classification": report.get("provenance", {}).get("dataset_classification"),
              "metrics": report.get("metrics"),
              "release_approved": report.get("release_gate", {}).get("release_approved"),
          }
          print(json.dumps(summary, sort_keys=True))
          if summary["status"] != "pass":
              raise SystemExit("Offline red-team regression gate failed")
          if summary["dataset_classification"] != "synthetic_only":
              raise SystemExit("Unexpected red-team dataset classification")
          if summary["release_approved"] is not False:
              raise SystemExit("Regression suite must never approve a release")
          if not isinstance(summary["dataset_sha256"], str) or len(summary["dataset_sha256"]) != 64:
              raise SystemExit("Missing or invalid dataset SHA-256")
          PY
      - name: Run integration tests
        run: pytest backend/tests/integration/ -v --tb=short

  security:
    name: Security and Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install security tools
        run: python -m pip install --upgrade pip bandit semgrep ruff
      - name: Bandit SAST scan
        run: bandit -r backend/ -ll -x backend/tests/
      - name: Ruff lint (blocking)
        run: |
          ruff check --fix backend/ || true
          git diff -- backend/core/production_config.py backend/tests/unit/test_production_config.py
          ruff check backend/
      - name: Semgrep scan
        run: semgrep --config=auto backend/ --error

  frontend:
    name: Frontend Build and Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: TypeScript check
        working-directory: frontend
        run: npm run type-check
      - name: ESLint
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZGV2ZWxvcG1lbnQuZXhhbXBsZS5jb20k
          CLERK_SECRET_KEY: sk_test_ZGV2ZWxvcG1lbnQuZXhhbXBsZS5jb20k
          NEXT_PUBLIC_API_URL: https://aithyrex-build.invalid
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build Docker image
        run: docker build -t tinlance/aithyrex:ci .
