name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run unit tests
        run: pytest backend/tests/unit/ -v --tb=short

      - name: Run integration tests
        run: pytest backend/tests/integration/ -v --tb=short
        continue-on-error: true   # integration tests need live services

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install security tools
        run: pip install bandit semgrep ruff

      - name: Bandit SAST scan
        run: bandit -r backend/ -ll -x backend/tests/

      - name: Ruff lint
        run: ruff check backend/

      - name: Semgrep scan
        run: semgrep --config=auto backend/ --error
        continue-on-error: true

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t tinlance/ai-shield:latest .
