name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
      - name: Run unit tests
        run: pytest backend/tests/unit/ -v --tb=short
      - name: Run integration tests
        run: pytest backend/tests/integration/ -v --tb=short

  security:
    name: Security and Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install security tools
        run: python -m pip install --upgrade pip bandit semgrep ruff
      - name: Bandit SAST scan
        run: bandit -r backend/ -ll -x backend/tests/
      - name: Ruff correctness lint (blocking)
        run: ruff check backend/ --select E4,E7,E9,F63,F7,F82,F811
      - name: Ruff full lint inventory
        continue-on-error: true
        run: ruff check backend/ --output-format=github
      - name: Semgrep scan
        run: semgrep --config=auto backend/ --error

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build Docker image
        run: docker build -t tinlance/aithyrex:ci .
