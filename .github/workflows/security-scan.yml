name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1" # Weekly Monday 02:00 UTC

permissions:
  contents: read

jobs:
  owasp:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit dependencies
        run: pip-audit -r backend/requirements.txt

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Compare event revisions on push/PR. Leave both empty on a schedule so
      # the action uses its full-history scan path rather than main vs HEAD.
      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@0e427395344c7039c0b15a1147f5782805685b3e
        with:
          path: ./
          base: ${{ github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before || (github.event_name == 'pull_request' && github.event.pull_request.base.sha) || '' }}
          head: ${{ github.event_name == 'push' && github.sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha) || '' }}
