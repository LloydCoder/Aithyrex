name: Temporary Ruff Autofix (Remediation Branch)

on:
  push:
    branches: [godmode/phase-00-04-hardening]

permissions:
  contents: write

jobs:
  safe-autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install pinned Ruff
        run: python -m pip install ruff==0.14.0
      - name: Apply safe autofixes
        run: ruff check backend/ --fix || true
      - name: Commit safe autofixes
        shell: bash
        run: |
          git diff --check
          if git diff --quiet; then
            echo "No safe Ruff autofixes available."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/
          git commit -m "style: apply safe Ruff autofixes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Report remaining lint findings
        continue-on-error: true
        run: ruff check backend/ --output-format=github
