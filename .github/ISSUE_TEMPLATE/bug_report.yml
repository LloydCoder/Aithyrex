name: Bug report
description: Report a reproducible defect in Aithyrex.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, access tokens, customer prompts/completions, personal data, or sensitive production telemetry. For vulnerabilities, use SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Package version or full commit SHA.
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.x"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating environment
      description: OS, container/runtime and relevant provider/framework versions.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use synthetic or redacted data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant redacted logs
      description: Remove secrets, personal data and customer payloads.
    validations:
      required: false
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I removed secrets and sensitive/customer data from this report.
          required: true
