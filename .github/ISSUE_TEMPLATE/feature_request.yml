name: Feature request
description: Propose a focused capability or improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Aithyrex emits findings. Identity, authorization, policy, approvals and governed execution remain outside Aithyrex.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What concrete user problem or limitation are you addressing?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: textarea
    id: security
    attributes:
      label: Security, privacy and tenant-isolation impact
      description: Include trust boundaries, failure semantics and new data handled.
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues and documentation.
          required: true
        - label: This proposal does not treat a finding as an authorization grant.
          required: true
