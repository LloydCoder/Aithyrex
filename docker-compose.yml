version: "3.9"

# LOCAL DEVELOPMENT ONLY: default credentials, published database/Redis ports,
# source bind mounts and --reload are intentionally unsuitable for production.
services:

  # ── PostgreSQL 16 ─────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aithyrex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aishield
      POSTGRES_USER: aishield
      POSTGRES_PASSWORD: aishield_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aishield -d aishield"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis 7 ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: aithyrex-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Aithyrex API ─────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aithyrex-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      APP_ENV: development
      APP_SECRET_KEY: dev-secret-change-in-production
      DATABASE_URL: postgresql+asyncpg://aishield:aishield_dev@postgres:5432/aishield
      REDIS_URL: redis://redis:6379/0
      THREATFADE_API_URL: ${THREATFADE_API_URL:-http://host.docker.internal:8000}
      THREATFADE_API_KEY: ${THREATFADE_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      KALEVIOAI_API_URL: ${KALEVIOAI_API_URL:-}
      KALEVIOAI_API_KEY: ${KALEVIOAI_API_KEY:-}
      LEMONSQUEEZY_API_KEY: ${LEMONSQUEEZY_API_KEY:-}
      LEMONSQUEEZY_STORE_ID: ${LEMONSQUEEZY_STORE_ID:-}
      PADDLE_API_KEY: ${PADDLE_API_KEY:-}
      SPLUNK_HEC_URL: ${SPLUNK_HEC_URL:-}
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health/live', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app/backend
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn backend.main:app --host 0.0.0.0 --port 8002 --reload
      "

volumes:
  postgres_data:
  redis_data:
